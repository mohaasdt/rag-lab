[project]
name = "rag-lab"
version = "0.1.0"
description = "Step-by-step RAG lab: ingestion, OCR, embeddings, vector stores, LangChain, hybrid search and evaluation, fully local with Ollama"
readme = "README.md"
authors = [
    { name = "Mohammed", email = "oulhadjmohamed62@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "faiss-cpu>=1.15.1",
    "langchain>=1.4.7",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "numpy>=2.5.4",
    "ollama>=0.6.3",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "pymupdf>=2.0",
    "rank-bm25>=0.2.2",
    "rapidocr-onnxruntime>=1.4.4",
    "sentence-transformers>=6.2.0",
    "uuid-utils==0.12.0",
]



[tool.uv]
# Smart App Control (Windows) bloque les Python non signés téléchargés par uv :
# on utilise uniquement le Python officiel installé sur le PC.
python-preference = "only-system"
# rag-lab est un dossier de scripts, pas une bibliothèque : uv ne l'installe pas dans le .venv
# (évite l'erreur « failed to remove directory rag_lab-0.1.0.dist-info : Accès refusé »).
package = false
